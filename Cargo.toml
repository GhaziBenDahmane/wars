[package]
name = "agentwars"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "net", "sync", "process", "io-util"] }
tokio-tungstenite = "0.30.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
